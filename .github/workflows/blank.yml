name: Ubuntu Desktop (XFCE + VNC + Browser)

on:
  workflow_dispatch:
    inputs:
      vnc_password:
        description: "VNC password (min 6 characters)"
        required: true
        type: string
      duration:
        description: "Session duration in minutes (max 60)"
        required: false
        default: "30"
        type: number

jobs:
  desktop:
    name: Ubuntu XFCE Desktop
    runs-on: ubuntu-latest
    timeout-minutes: 65

    steps:
      - name: Install XFCE desktop
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-goodies \
            dbus-x11 \
            xfonts-base \
            x11-xserver-utils
          echo "✔ XFCE installed"

      - name: Install TigerVNC + noVNC
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            tigervnc-standalone-server \
            tigervnc-common \
            novnc \
            websockify
          echo "✔ TigerVNC + noVNC installed"

      - name: Configure VNC server
        env:
          VNC_PASSWORD: ${{ github.event.inputs.vnc_password }}
        run: |
          mkdir -p ~/.vnc

          # Set VNC password
          VNC_PASS_BIN=$(which vncpasswd || find /usr -name vncpasswd 2>/dev/null | head -1)
          echo "$VNC_PASSWORD" | "$VNC_PASS_BIN" -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd
          echo "✔ VNC password set"

          # XFCE startup — disable light-locker & power manager to avoid container errors
          cat > ~/.vnc/xstartup << 'EOF'
          #!/bin/bash
          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          export XDG_SESSION_TYPE=x11

          # Suppress common container warnings
          export NO_AT_BRIDGE=1
          export LIBDBUSMENU_GREETER_DIR=/dev/null

          # Disable screen locking and power management (unsupported in container)
          xfconf-query -c xfce4-screensaver -p /saver/enabled -s false 2>/dev/null || true
          xfconf-query -c xfce4-power-manager -p /xfce4-power-manager/presentation-mode -s true 2>/dev/null || true

          exec startxfce4
          EOF
          chmod +x ~/.vnc/xstartup
          echo "✔ xstartup configured"

      - name: Start VNC server
        run: |
          VNC_SERVER_BIN=$(which vncserver || find /usr -name vncserver 2>/dev/null | head -1)

          "$VNC_SERVER_BIN" :1 \
            -geometry 1280x720 \
            -depth 24 \
            -localhost yes \
            -SecurityTypes VncAuth
          sleep 5

          # ── Verify by checking port 5901 directly ──────────────────────
          # (vncserver -list is unreliable in CI — port check is more robust)
          if ss -tlnp 2>/dev/null | grep -q ':5901' || \
             netstat -tlnp 2>/dev/null | grep -q ':5901'; then
            echo "✔ VNC server confirmed running on port 5901"
          else
            echo "✘ Port 5901 not listening. VNC logs:"
            cat ~/.vnc/*.log 2>/dev/null | tail -20 || true
            exit 1
          fi

      - name: Start noVNC on port 6080
        run: |
          websockify --daemon \
            --web /usr/share/novnc \
            6080 \
            localhost:5901
          sleep 2

          # Verify noVNC
          if ss -tlnp | grep -q ':6080'; then
            echo "✔ noVNC running on port 6080"
          else
            echo "✘ noVNC failed to start"
            exit 1
          fi

      - name: Install and start Cloudflare tunnel
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg \
            | sudo tee /usr/share/keyrings/cloudflare-main.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] \
            https://pkg.cloudflare.com/cloudflared any main" \
            | sudo tee /etc/apt/sources.list.d/cloudflared.list
          sudo apt-get update -qq && sudo apt-get install -y cloudflared

          cloudflared tunnel --no-autoupdate run --token "$CLOUDFLARE_TUNNEL_TOKEN" &
          sleep 5

          CF_VNC="${{ secrets.CF_VNC_HOSTNAME }}"
          CF_NOVNC="${{ secrets.CF_NOVNC_HOSTNAME }}"

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║            XFCE Desktop — Connection Details                 ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║  BROWSER (Android Chrome — no app needed):                   ║"
          printf "║    https://%-50s║\n" "$CF_NOVNC/vnc.html"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║  VNC APP (Termux + RealVNC):                                  ║"
          printf "║    cloudflared access tcp --hostname %-24s║\n" "$CF_VNC"
          echo "║    --url localhost:5901                                       ║"
          echo "║    Then open RealVNC → localhost:5901                         ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║  Password: (what you entered in the workflow input)           ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          DURATION=${{ github.event.inputs.duration }}
          if [ "$DURATION" -gt 60 ]; then DURATION=60; fi
          echo "Session open for ${DURATION} minute(s)..."
          sleep $(( DURATION * 60 ))

      - name: Cleanup
        if: always()
        run: vncserver -kill :1 2>/dev/null || true
