name: SSH Tunnel via Cloudflare

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Tunnel duration in minutes (max 60)"
        required: false
        default: "30"
        type: number
      ssh_password:
        description: "Temporary SSH password for this session"
        required: true
        type: string

jobs:
  ssh-tunnel:
    name: Open SSH Tunnel
    runs-on: ubuntu-latest
    timeout-minutes: 65

    steps:
      - name: Configure SSH password authentication
        env:
          SESSION_PASSWORD: ${{ github.event.inputs.ssh_password }}
        run: |
          echo "runner:${SESSION_PASSWORD}" | sudo chpasswd

          sudo sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/'           /etc/ssh/sshd_config
          sudo sed -i 's/^#\?ChallengeResponseAuthentication.*/ChallengeResponseAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#\?PermitEmptyPasswords.*/PermitEmptyPasswords no/'                /etc/ssh/sshd_config
          sudo sed -i 's/^#\?PubkeyAuthentication.*/PubkeyAuthentication yes/'               /etc/ssh/sshd_config

          sudo systemctl restart ssh
          echo "✔ SSH daemon ready with password auth"

      - name: Install cloudflared
        run: |
          curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg \
            | sudo tee /usr/share/keyrings/cloudflare-main.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] \
            https://pkg.cloudflare.com/cloudflared any main" \
            | sudo tee /etc/apt/sources.list.d/cloudflared.list
          sudo apt-get update -qq && sudo apt-get install -qq cloudflared
          cloudflared --version

      - name: Start Cloudflare Tunnel
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          # Run the tunnel in background using the token from CF dashboard
          cloudflared tunnel --no-autoupdate run --token "$CLOUDFLARE_TUNNEL_TOKEN" &
          sleep 5
          echo "✔ Cloudflare Tunnel started"

          # ── Print connection instructions ──────────────────────────────
          CF_HOSTNAME="${{ secrets.CF_SSH_HOSTNAME }}"   # e.g. ssh.yourdomain.com

          echo ""
          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║          Cloudflare SSH — Connection Details             ║"
          echo "╠══════════════════════════════════════════════════════════╣"
          printf "║  Hostname : %-44s║\n" "$CF_HOSTNAME"
          echo "║  Username : runner                                       ║"
          echo "║  Password : (what you typed above)                       ║"
          echo "╠══════════════════════════════════════════════════════════╣"
          echo "║  Termux — first time setup:                              ║"
          echo "║    pkg update && pkg install cloudflared openssh         ║"
          echo "╠══════════════════════════════════════════════════════════╣"
          echo "║  Termux — connect:                                       ║"
          printf "║    ssh -o ProxyCommand=\"cloudflared access tcp           ║\n"
          printf "║    --hostname %s\"                   ║\n" "$CF_HOSTNAME"
          printf "║    runner@%s                          ║\n" "$CF_HOSTNAME"
          echo "╠══════════════════════════════════════════════════════════╣"
          echo "║  ~/.ssh/config shortcut (paste in Termux):               ║"
          echo "║    Host cf-runner                                        ║"
          printf "║      HostName %-44s║\n"  "$CF_HOSTNAME"
          echo "║      User runner                                         ║"
          printf "║      ProxyCommand cloudflared access tcp               ║\n"
          printf "║               --hostname %s        ║\n" "$CF_HOSTNAME"
          echo "║  Then just: ssh cf-runner                                ║"
          echo "╚══════════════════════════════════════════════════════════╝"

          # ── Keep alive ─────────────────────────────────────────────────
          DURATION=${{ github.event.inputs.duration }}
          if [ "$DURATION" -gt 60 ]; then DURATION=60; fi
          echo ""
          echo "Tunnel open for ${DURATION} minute(s). Sleeping..."
          sleep $(( DURATION * 60 ))
