name: Ubuntu Desktop (XFCE + VNC + Browser)

on:
  workflow_dispatch:
    inputs:
      vnc_password:
        description: "VNC password (min 6 characters)"
        required: true
        type: string
      duration:
        description: "Session duration in minutes (max 60)"
        required: false
        default: "30"
        type: number

jobs:
  desktop:
    name: Ubuntu XFCE Desktop
    runs-on: ubuntu-latest
    timeout-minutes: 65

    steps:
      - name: Install XFCE + TigerVNC + noVNC
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -qq \
            xfce4 \
            xfce4-goodies \
            tigervnc-standalone-server \
            tigervnc-common \
            novnc \
            websockify \
            dbus-x11 \
            xfonts-base \
            x11-xserver-utils \
            --no-install-recommends
          echo "✔ XFCE + TigerVNC + noVNC installed"

      - name: Configure VNC server
        env:
          VNC_PASSWORD: ${{ github.event.inputs.vnc_password }}
        run: |
          mkdir -p ~/.vnc

          # Set VNC password
          echo "$VNC_PASSWORD" | vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd

          # XFCE startup script
          cat > ~/.vnc/xstartup << 'EOF'
          #!/bin/bash
          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          export XDG_SESSION_TYPE=x11
          exec startxfce4
          EOF
          chmod +x ~/.vnc/xstartup
          echo "✔ VNC configured"

      - name: Start VNC server
        run: |
          vncserver :1 \
            -geometry 1280x720 \
            -depth 24 \
            -localhost yes \
            -SecurityTypes VncAuth
          sleep 4

          if vncserver -list | grep -q ":1"; then
            echo "✔ VNC running on port 5901"
          else
            echo "✘ VNC failed — check logs:"
            cat ~/.vnc/*.log 2>/dev/null || true
            exit 1
          fi

      - name: Start noVNC (browser access on port 6080)
        run: |
          # websockify bridges noVNC (port 6080) → VNC (port 5901)
          websockify --daemon \
            --web /usr/share/novnc \
            6080 \
            localhost:5901
          sleep 2
          echo "✔ noVNC running on port 6080"

      - name: Install cloudflared
        run: |
          curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg \
            | sudo tee /usr/share/keyrings/cloudflare-main.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] \
            https://pkg.cloudflare.com/cloudflared any main" \
            | sudo tee /etc/apt/sources.list.d/cloudflared.list
          sudo apt-get update -qq && sudo apt-get install -qq cloudflared
          echo "✔ cloudflared installed"

      - name: Start Cloudflare tunnel
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          cloudflared tunnel --no-autoupdate run --token "$CLOUDFLARE_TUNNEL_TOKEN" &
          sleep 5
          echo "✔ Cloudflare tunnel started"

          CF_VNC="${{ secrets.CF_VNC_HOSTNAME }}"       # e.g. vnc.testifysamples.com
          CF_NOVNC="${{ secrets.CF_NOVNC_HOSTNAME }}"   # e.g. desktop.testifysamples.com

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║            XFCE Desktop — Connection Details                 ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║  🌐 BROWSER (easiest):                                        ║"
          printf "║     https://%-49s║\n" "$CF_NOVNC/vnc.html"
          echo "║     No app needed — open in Chrome on Android                ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║  📱 VNC APP (RealVNC / bVNC):                                 ║"
          echo "║     1. Termux: cloudflared access tcp                         ║"
          printf "║              --hostname %s            ║\n" "$CF_VNC"
          echo "║              --url localhost:5901                             ║"
          echo "║     2. VNC app → localhost:5901                               ║"
          echo "║     Password: (what you entered above) for both               ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""

          DURATION=${{ github.event.inputs.duration }}
          if [ "$DURATION" -gt 60 ]; then DURATION=60; fi
          echo "Desktop session open for ${DURATION} minute(s)..."
          sleep $(( DURATION * 60 ))

      - name: Cleanup
        if: always()
        run: vncserver -kill :1 2>/dev/null || true
