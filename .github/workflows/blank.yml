- name: Open SSH tunnel via ngrok
  env:
    NGROK_TOKEN: ${{ secrets.NGROK_TOKEN }}
  run: |
    # Install ngrok
    curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
    echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
    sudo apt-get update -qq && sudo apt-get install -qq ngrok

    # Auth and start tunnel
    ngrok config add-authtoken "$NGROK_TOKEN"
    ngrok tcp 22 &

    # Print the connection string
    sleep 3
    curl -s http://localhost:4040/api/tunnels | python3 -c "
    import sys,json
    t = json.load(sys.stdin)['tunnels'][0]['public_url']
    host, port = t.replace('tcp://','').split(':')
    print(f'ssh runner@{host} -p {port}')
    "

    # Keep the job alive for 30 mins so you can work
    sleep 1800
