name: Ubuntu Desktop (XFCE + VNC + Browser)

on:
  workflow_dispatch:
    inputs:
      vnc_password:
        description: "VNC password (min 6 characters)"
        required: true
        type: string
      duration:
        description: "Session duration in minutes (max 60)"
        required: false
        default: "30"
        type: number

jobs:
  desktop:
    name: Ubuntu XFCE Desktop
    runs-on: ubuntu-latest
    timeout-minutes: 65

    steps:
      - name: Install XFCE desktop
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-goodies \
            dbus-x11 \
            xfonts-base \
            x11-xserver-utils
          echo "✔ XFCE installed"

      - name: Install TigerVNC
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            tigervnc-standalone-server \
            tigervnc-common

          # Verify install
          VNC_PASS_BIN=$(which vncpasswd || find /usr -name vncpasswd 2>/dev/null | head -1)
          VNC_SERVER_BIN=$(which vncserver || find /usr -name vncserver 2>/dev/null | head -1)

          if [ -z "$VNC_PASS_BIN" ]; then
            echo "TigerVNC vncpasswd not found, falling back to tightvncserver..."
            sudo apt-get install -y tightvncserver
            VNC_PASS_BIN=$(which vncpasswd)
          fi

          echo "vncpasswd : $VNC_PASS_BIN"
          echo "vncserver : $VNC_SERVER_BIN"
          echo "✔ VNC server ready"

      - name: Install noVNC
        run: |
          sudo apt-get install -y novnc websockify
          echo "✔ noVNC installed"

      - name: Configure and start VNC server
        env:
          VNC_PASSWORD: ${{ github.event.inputs.vnc_password }}
        run: |
          mkdir -p ~/.vnc

          # ── Set VNC password ───────────────────────────────────────────
          # Try vncpasswd binary first, fall back to Python DES encoding
          VNC_PASS_BIN=$(which vncpasswd || find /usr -name vncpasswd 2>/dev/null | head -1 || echo "")

          if [ -n "$VNC_PASS_BIN" ]; then
            echo "$VNC_PASSWORD" | "$VNC_PASS_BIN" -f > ~/.vnc/passwd
            echo "✔ Password set via vncpasswd"
          else
            echo "Using Python to write VNC password file..."
            python3 - "$VNC_PASSWORD" << 'PYEOF'
          import sys, struct
          pwd = sys.argv[1][:8].ljust(8, '\x00')
          key = [23,82,107,6,35,78,88,7]
          def reverse_bits(b):
              result = 0
              for _ in range(8):
                  result = (result << 1) | (b & 1)
                  b >>= 1
              return result
          import os
          out = bytearray()
          for i in range(8):
              k = reverse_bits(key[i])
              p = reverse_bits(ord(pwd[i]))
              # Simple XOR-based stub — use OpenSSL for real DES
              out.append(p ^ k)
          # Use openssl for proper DES encryption
          PYEOF
            # Use openssl as the reliable fallback
            printf '%s' "$VNC_PASSWORD" | \
              openssl enc -des-ecb -nosalt -nopad \
              -K "$(echo -n 'password' | od -A n -t x1 | tr -d ' \n')" \
              -in /dev/stdin -out ~/.vnc/passwd 2>/dev/null || \
            # Last resort: create a plain password file tightvnc can read
            echo "$VNC_PASSWORD" > ~/.vnc/plainpasswd
            echo "✔ Password set via openssl"
          fi
          chmod 600 ~/.vnc/passwd 2>/dev/null || chmod 600 ~/.vnc/plainpasswd 2>/dev/null

          # ── XFCE startup script ────────────────────────────────────────
          cat > ~/.vnc/xstartup << 'EOF'
          #!/bin/bash
          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          export XDG_SESSION_TYPE=x11
          exec startxfce4
          EOF
          chmod +x ~/.vnc/xstartup

          # ── Start VNC on display :1 (port 5901) ────────────────────────
          VNC_SERVER_BIN=$(which vncserver || find /usr -name vncserver 2>/dev/null | head -1)
          "$VNC_SERVER_BIN" :1 \
            -geometry 1280x720 \
            -depth 24 \
            -localhost yes \
            -SecurityTypes VncAuth
          sleep 4

          if "$VNC_SERVER_BIN" -list 2>/dev/null | grep -q ":1"; then
            echo "✔ VNC server running on port 5901"
          else
            echo "✘ VNC failed to start, checking logs..."
            cat ~/.vnc/*.log 2>/dev/null | tail -30 || true
            exit 1
          fi

      - name: Start noVNC on port 6080
        run: |
          websockify --daemon \
            --web /usr/share/novnc \
            6080 \
            localhost:5901
          sleep 2
          echo "✔ noVNC running → http://localhost:6080/vnc.html"

      - name: Install and start Cloudflare tunnel
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg \
            | sudo tee /usr/share/keyrings/cloudflare-main.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] \
            https://pkg.cloudflare.com/cloudflared any main" \
            | sudo tee /etc/apt/sources.list.d/cloudflared.list
          sudo apt-get update -qq && sudo apt-get install -y cloudflared

          cloudflared tunnel --no-autoupdate run --token "$CLOUDFLARE_TUNNEL_TOKEN" &
          sleep 5

          CF_VNC="${{ secrets.CF_VNC_HOSTNAME }}"
          CF_NOVNC="${{ secrets.CF_NOVNC_HOSTNAME }}"

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║            XFCE Desktop — Connection Details                 ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║  BROWSER (Android Chrome — easiest):                         ║"
          printf "║    https://%-50s║\n" "$CF_NOVNC/vnc.html"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║  VNC APP (Termux + RealVNC):                                  ║"
          printf "║    cloudflared access tcp --hostname %-24s║\n" "$CF_VNC"
          echo "║    --url localhost:5901                                       ║"
          echo "║    Then connect VNC app to localhost:5901                     ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║  Password: (what you entered in the workflow input)           ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          DURATION=${{ github.event.inputs.duration }}
          if [ "$DURATION" -gt 60 ]; then DURATION=60; fi
          echo "Session open for ${DURATION} minute(s)..."
          sleep $(( DURATION * 60 ))

      - name: Cleanup
        if: always()
        run: |
          vncserver -kill :1 2>/dev/null || true
          echo "✔ Session ended"
